<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Journeys &amp; Empires — A Biblical World Timeline</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap');
  :root{
    --parchment:#EDE4D3; --parchment-dk:#E3D8BC; --panel:#F4EEDC;
    --ink:#2B2418; --ink-soft:#5A4B32; --gold:#8A6D3F;
    --sea:#20455B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--parchment);color:var(--ink);font-family:'Inter',sans-serif;}
  .font-display{font-family:'Cinzel',serif;}
  .font-body{font-family:'Crimson Pro',serif;}
  #app{display:flex;flex-direction:column;height:100vh;min-height:600px;}

  header{padding:18px 28px 14px;border-bottom:2px solid rgba(90,75,50,0.3);flex-shrink:0;}
  .eyebrow{display:flex;align-items:center;gap:8px;color:var(--gold);font-size:11px;letter-spacing:.3em;text-transform:uppercase;}
  h1{font-family:'Cinzel',serif;font-size:28px;font-weight:700;letter-spacing:.02em;margin:4px 0 0;}
  .chips{margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;}
  .chip{border:1px solid rgba(90,75,50,.35);background:transparent;color:var(--ink-soft);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.03em;padding:5px 10px;border-radius:3px;cursor:pointer;transition:all .15s;}
  .chip:hover{border-color:var(--ink-soft);}
  .chip.active{color:var(--panel);transform:scale(1.05);box-shadow:0 1px 4px rgba(0,0,0,.25);}
  .meta-row{margin-top:12px;display:flex;flex-wrap:wrap;gap:10px 32px;font-family:'Crimson Pro',serif;font-size:15px;}
  .meta-row .label{font-family:'Inter',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.2em;color:var(--gold);margin-right:6px;}

  main{flex:1;display:grid;grid-template-columns:2fr 1fr;gap:16px;padding:16px 20px;min-height:0;}
  @media (max-width:900px){ main{grid-template-columns:1fr;} }

  #mapwrap{position:relative;border:2px solid rgba(90,75,50,.4);border-radius:8px;overflow:hidden;box-shadow:inset 0 0 24px rgba(0,0,0,.25);}
  #map{width:100%;height:100%;background:var(--sea);}
  .era-badge{position:absolute;bottom:12px;left:12px;z-index:500;background:rgba(237,228,211,.92);border:1px solid rgba(90,75,50,.3);border-radius:5px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;}
  .era-dot{width:11px;height:11px;border-radius:50%;display:inline-block;}
  .map-credit{position:absolute;bottom:8px;right:10px;z-index:500;font-size:10px;color:#fff;opacity:.7;text-shadow:0 1px 2px #000;}

  #panel{border:2px solid rgba(90,75,50,.4);border-radius:8px;background:var(--panel);padding:20px;display:flex;flex-direction:column;overflow-y:auto;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .panel-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.2em;font-weight:700;padding:3px 9px;border-radius:3px;color:var(--ink);width:fit-content;}
  .panel h2{font-family:'Cinzel',serif;font-size:23px;margin:10px 0 0;}
  .panel .country{font-family:'Crimson Pro',serif;font-style:italic;color:var(--ink-soft);margin:0 0 10px;}
  .stat-row{display:flex;gap:24px;font-size:13px;margin-bottom:10px;}
  .stat-row .k{color:var(--gold);text-transform:uppercase;font-size:11px;letter-spacing:.1em;}
  .stat-row .v{font-weight:600;}
  hr{border:none;border-top:1px solid rgba(90,75,50,.2);margin:10px 0;}
  .summary{font-family:'Crimson Pro',serif;font-size:16px;line-height:1.6;flex:1;}
  .territory-line{font-size:12px;color:var(--ink-soft);}
  .territory-line b{font-weight:700;}
  .nav-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid rgba(90,75,50,.2);}
  .navbtn{display:flex;align-items:center;gap:5px;padding:7px 13px;border-radius:3px;border:1px solid rgba(90,75,50,.4);background:transparent;color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;font-weight:500;cursor:pointer;}
  .navbtn:disabled{opacity:.3;cursor:default;}
  .navbtn:not(:disabled):hover{background:rgba(90,75,50,.1);}
  .stepcount{font-size:11px;color:var(--gold);}

  footer{border-top:2px solid rgba(90,75,50,.3);background:var(--parchment-dk);padding:14px 20px;flex-shrink:0;}
  .transport{display:flex;align-items:center;gap:14px;}
  #playbtn{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--panel);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.3);}
  #playbtn:hover{filter:brightness(1.1);}
  #speedbtn{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:3px;border:1px solid rgba(90,75,50,.4);background:transparent;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
  #speedbtn:hover{background:rgba(90,75,50,.1);}
  .slider-wrap{flex:1;position:relative;padding-top:6px;}
  #slider{width:100%;height:6px;border-radius:99px;appearance:none;cursor:pointer;background:#C9B896;}
  #slider::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.4);cursor:pointer;}
  #slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--panel);cursor:pointer;}
  .ticks{position:relative;width:100%;height:8px;margin-top:3px;}
  .tick{position:absolute;top:0;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);opacity:.55;}
  .tick.on{opacity:1;transform:translateX(-50%) scale(1.6);}
  .year-badge{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-soft);width:96px;justify-content:flex-end;flex-shrink:0;}

  .leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:5px;font-family:'Inter',sans-serif;}
  .leaflet-popup-tip{background:var(--panel);}
  .pin-label{font-size:11px;font-weight:700;font-family:'Inter',sans-serif;color:var(--panel);text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="eyebrow">📜 <span>Genesis Through Acts — A Real, Zoomable World Map</span></div>
    <h1>Journeys &amp; Empires</h1>
    <div class="chips" id="chips"></div>
    <div class="meta-row">
      <div><span class="label">Now Viewing</span><span id="eraLabel" style="font-weight:600;"></span></div>
      <div><span class="label">Dated</span><span id="eraYears"></span></div>
      <div>🏛️ <span class="label">Land Ruled By</span><span id="territoryLabel" style="font-weight:600;"></span></div>
    </div>
  </header>

  <main>
    <div id="mapwrap">
      <div id="map"></div>
      <div class="era-badge"><span class="era-dot" id="eraBadgeDot"></span><span id="eraBadgeLabel"></span></div>
      <div class="map-credit">Map data © OpenStreetMap contributors</div>
    </div>

    <div id="panel">
      <span class="panel-tag" id="panelTag"></span>
      <h2 id="cityName"></h2>
      <p class="country" id="cityCountry"></p>
      <div class="stat-row">
        <div><div class="k">Dated</div><div class="v" id="statYears"></div></div>
        <div><div class="k">Reference</div><div class="v" id="statRef"></div></div>
      </div>
      <hr/>
      <p class="summary" id="summary"></p>
      <hr/>
      <div class="territory-line">Land at this time: <b id="territoryLine"></b></div>
      <div class="nav-row">
        <button class="navbtn" id="prevBtn">‹ Prev</button>
        <span class="stepcount" id="stepCount"></span>
        <button class="navbtn" id="nextBtn">Next ›</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="transport">
      <button id="playbtn" aria-label="Play">▶</button>
      <button id="speedbtn">⏱ 1x</button>
      <div class="slider-wrap">
        <input type="range" id="slider" min="0" value="0" />
        <div class="ticks" id="ticks"></div>
      </div>
      <div class="year-badge">⚓ <span id="yearBadge"></span></div>
    </div>
  </footer>
</div>

function getTerritoryForYear(y){ return TERRITORY_ERAS.find(t=>y>=t.start && y<t.end) || TERRITORY_ERAS[0]; }
function yearLabel(y){ return y<0 ? `${Math.abs(y)} BC` : `AD ${y}`; }

  {era:"paul2",step:2,city:CITY.derbe,year:49,years:"AD 49",ref:"Acts 16:1",summary:"Passing again through Syria and Cilicia, Paul strengthens the churches on his way to Derbe and Lystra."},
  {era:"paul2",step:3,city:CITY.lystra,year:49,years:"AD 49",ref:"Acts 16:1-5",summary:"Paul meets the young disciple Timothy, has him circumcised for the sake of the Jews, and adds him to the missionary band."},
  {era:"paul2",step:4,city:CITY.troas,year:49,years:"AD 49",ref:"Acts 16:8-10",summary:"Forbidden by the Spirit to enter Asia or Bithynia, Paul receives a night vision of a Macedonian man pleading, 'Come over and help us.'"},
  {era:"paul2",step:5,city:CITY.philippi,year:50,years:"AD 49-50",ref:"Acts 16:11-40",summary:"Lydia the purple-cloth dealer is converted at the riverside; after Paul exorcises a slave girl, he and Silas are flogged and jailed, then freed by an earthquake."},
  {era:"paul2",step:6,city:CITY.thessalonica,year:50,years:"AD 50",ref:"Acts 17:1-9",summary:"Paul reasons from the Scriptures in the synagogue for three Sabbaths; jealous opponents form a mob and drag believers before the city officials."},
  {era:"paul2",step:7,city:CITY.berea,year:50,years:"AD 50",ref:"Acts 17:10-14",summary:"The Berean Jews are commended as noble-minded, examining the Scriptures daily to test Paul's message, until agitators arrive from Thessalonica."},
  {era:"paul2",step:8,city:CITY.athens,year:50,years:"AD 50",ref:"Acts 17:16-34",summary:"Distressed by the city's idols, Paul addresses the philosophers at the Areopagus, proclaiming the 'unknown god' as the one true Creator."},
  {era:"paul2",step:9,city:CITY.corinth,year:51,years:"AD 50-52",ref:"Acts 18:1-17",summary:"Paul settles for eighteen months, partners with tentmakers Aquila and Priscilla, and is brought before proconsul Gallio, who dismisses the charges against him."},
  {era:"paul2",step:10,city:CITY.ephesus,year:52,years:"AD 52",ref:"Acts 18:18-21",summary:"Paul stops briefly, reasons in the synagogue, and promises to return if God wills, leaving Priscilla and Aquila behind."},
  {era:"paul2",step:11,city:CITY.caesarea,year:52,years:"AD 52",ref:"Acts 18:22",summary:"Paul lands at Caesarea, goes up to greet the church at Jerusalem, then returns north to Antioch, closing the second journey."},

  {era:"paul3",step:1,city:CITY.antiochSyria,year:53,years:"AD 53",ref:"Acts 18:23",summary:"Paul departs from Antioch once more, traveling through Galatia and Phrygia strengthening every disciple along the way."},
  {era:"paul3",step:2,city:CITY.ephesus,year:55,years:"AD 53-56",ref:"Acts 19:1-41",summary:"Over roughly three years Paul teaches daily in the hall of Tyrannus; extraordinary miracles occur, and a riot erupts led by the silversmith Demetrius, whose idol trade is threatened."},
  {era:"paul3",step:3,city:CITY.philippi,year:56,years:"AD 56",ref:"Acts 20:1-2",summary:"Paul travels through Macedonia, encouraging the churches at Philippi and Thessalonica with many words of comfort."},
  {era:"paul3",step:4,city:CITY.corinth,year:56,years:"AD 56-57",ref:"Acts 20:2-3",summary:"Paul spends three months in Greece, likely writing his letter to the Romans, before a plot against him alters his travel plans."},
  {era:"paul3",step:5,city:CITY.troas,year:57,years:"AD 57",ref:"Acts 20:6-12",summary:"During an all-night sermon, young Eutychus falls asleep, tumbles from a third-story window, and is raised back to life by Paul."},
  {era:"paul3",step:6,city:CITY.miletus,year:57,years:"AD 57",ref:"Acts 20:17-38",summary:"Paul summons the Ephesian elders for an emotional farewell, warning of coming hardship and 'savage wolves' who will rise from among them."},
  {era:"paul3",step:7,city:CITY.tyre,year:57,years:"AD 57",ref:"Acts 21:3-6",summary:"Disciples at Tyre, prompted by the Spirit, urge Paul not to go on to Jerusalem, foreseeing what awaits him."},
  {era:"paul3",step:8,city:CITY.ptolemais,year:57,years:"AD 57",ref:"Acts 21:7",summary:"Paul greets the brothers at Ptolemais and stays with them a single day before continuing south."},
  {era:"paul3",step:9,city:CITY.caesarea,year:57,years:"AD 57",ref:"Acts 21:8-14",summary:"The prophet Agabus binds his own hands and feet with Paul's belt, foretelling his arrest; Paul declares himself ready even to die in Jerusalem."},
  {era:"paul3",step:10,city:CITY.jerusalem,year:57,years:"AD 57",ref:"Acts 21:15-17",summary:"Paul arrives in Jerusalem and is warmly received by the brothers, on the eve of the arrest that will lead him to Rome."},
];

/* ------------------------------------------------------------------ */
/* MAP SETUP                                                          */
/* ------------------------------------------------------------------ */
const map = L.map('map', { zoomControl:true, worldCopyJump:true }).setView([33.5, 34], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO',
  maxZoom:18
}).addTo(map);

// A rough polygon over the land of Israel/Judah for the territory tint
const israelPoly = L.polygon([
  [33.27,35.10],[33.09,35.60],[32.60,35.75],[31.90,35.75],[31.30,35.45],
  [31.20,34.95],[31.55,34.55],[32.05,34.75],[32.55,34.90],[33.0,34.95]
], { color:"#00000000", weight:0, fillOpacity:0.4 }).addTo(map);

let markers = [];
let routeLine = null;

function makeIcon(color, active, offmap){
  const size = active ? 22 : 14;
  const html = offmap
    ? `<div style="width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:12px solid ${color};filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));"></div>`
    : `<div style="width:${size}px;height:${size}px;border-radius:50%;background:${color};border:2.5px solid #2B2418;box-shadow:0 1px 4px rgba(0,0,0,.5);${active?'animation:pulse 1.8s infinite;':''}"></div>`;
  return L.divIcon({ html, className:'', iconSize:[size,size], iconAnchor:[size/2,size/2] });
}

const pulseStyle = document.createElement('style');
pulseStyle.textContent = `@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(0,0,0,.35);}70%{box-shadow:0 0 0 10px rgba(0,0,0,0);}100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}}`;
document.head.appendChild(pulseStyle);

/* ------------------------------------------------------------------ */
/* STATE                                                              */
/* ------------------------------------------------------------------ */
let stepIndex = 24; // start at Paul's Journey I
let isPlaying = false;
let speed = 1;
let playTimer = null;

const chipsEl = document.getElementById('chips');
ERA_ORDER.forEach(key => {
  const m = ERA_META[key];
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = m.label.replace("Paul's Journey","Paul").replace("'s ", " ");
  b.dataset.era = key;
  b.onclick = () => { jumpToEra(key); };
  chipsEl.appendChild(b);
});

function jumpToEra(eraKey){
  const idx = STOPS.findIndex(s => s.era === eraKey);
  if (idx >= 0){ goTo(idx); setPlaying(false); }
}

function currentEraStops(era){
  return STOPS.map((s,i)=>({...s, globalIndex:i})).filter(s=>s.era===era);
}

function goTo(idx){
  stepIndex = Math.max(0, Math.min(STOPS.length-1, idx));
  render();
}

function setPlaying(val){
  isPlaying = val;
  document.getElementById('playbtn').textContent = isPlaying ? '❚❚' : '▶';
  clearInterval(playTimer);
  if (isPlaying){
    playTimer = setInterval(()=>{
      if (stepIndex >= STOPS.length-1){ setPlaying(false); return; }
      goTo(stepIndex+1);
    }, 1500/speed);
  }
}

document.getElementById('playbtn').onclick = () => {
  if (stepIndex === STOPS.length-1){ goTo(0); setPlaying(true); }
  else setPlaying(!isPlaying);
};
document.getElementById('speedbtn').onclick = () => {
  speed = speed === 1 ? 2 : 1;
  document.getElementById('speedbtn').textContent = `⏱ ${speed}x`;
  if (isPlaying) setPlaying(true);
};
document.getElementById('prevBtn').onclick = () => { goTo(stepIndex-1); setPlaying(false); };
document.getElementById('nextBtn').onclick = () => { goTo(stepIndex+1); setPlaying(false); };

const slider = document.getElementById('slider');
slider.max = STOPS.length - 1;
slider.oninput = (e) => { goTo(Number(e.target.value)); setPlaying(false); };

// build ticks
const ticksEl = document.getElementById('ticks');
STOPS.forEach((s, idx) => {
  const t = document.createElement('div');
  t.className = 'tick';
  t.style.left = `${(idx/(STOPS.length-1))*100}%`;
  t.style.background = ERA_META[s.era].color;
  t.dataset.idx = idx;
  t.onclick = () => { goTo(idx); setPlaying(false); };
  ticksEl.appendChild(t);
});

function render(){
  const stop = STOPS[stepIndex];
  const era = stop.era;
  const meta = ERA_META[era];
  const territory = getTerritoryForYear(stop.year);
  const eraStops = currentEraStops(era);
  const localIndex = eraStops.findIndex(s => s.globalIndex === stepIndex);

  // header
  document.getElementById('eraLabel').textContent = meta.label;
  document.getElementById('eraLabel').style.color = meta.color;
  document.getElementById('eraYears').textContent = meta.years;
  document.getElementById('territoryLabel').textContent = territory.label;
  document.getElementById('territoryLabel').style.color = territory.color;
  document.getElementById('eraBadgeDot').style.background = meta.color;
  document.getElementById('eraBadgeLabel').textContent = meta.label;

  // chips
  document.querySelectorAll('.chip').forEach(c => {
    const active = c.dataset.era === era;
    c.classList.toggle('active', active);
    c.style.background = active ? meta.color : 'transparent';
    c.style.borderColor = active ? meta.color : (ERA_META[c.dataset.era].color + '80');
  });

  // panel
  document.getElementById('panelTag').textContent = `${meta.label} · Stop ${stop.step}`;
  document.getElementById('panelTag').style.background = meta.color;
  document.getElementById('cityName').textContent = stop.city.name + (stop.city.offmap ? ' (off map)' : '');
  document.getElementById('cityCountry').textContent = stop.city.country;
  document.getElementById('statYears').textContent = stop.years;
  document.getElementById('statRef').textContent = stop.ref;
  document.getElementById('summary').textContent = stop.summary;
  document.getElementById('territoryLine').textContent = territory.label;
  document.getElementById('territoryLine').style.color = territory.color;
  document.getElementById('stepCount').textContent = `${stepIndex+1} / ${STOPS.length}`;
  document.getElementById('prevBtn').disabled = stepIndex === 0;
  document.getElementById('nextBtn').disabled = stepIndex === STOPS.length-1;
  document.getElementById('yearBadge').textContent = yearLabel(stop.year);

  // slider + ticks
  slider.value = stepIndex;
  document.querySelectorAll('.tick').forEach(t => t.classList.toggle('on', Number(t.dataset.idx) === stepIndex));

  // territory tint
  israelPoly.setStyle({ fillColor: territory.color, fillOpacity: 0.38 });

  // markers + route for current era
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  if (routeLine) { map.removeLayer(routeLine); routeLine = null; }

  const latlngs = [];
  eraStops.forEach((s, idx) => {
    const active = idx === localIndex;
    const past = idx <= localIndex;
    const color = past ? meta.color : '#B0A489';
    const icon = makeIcon(color, active, s.city.offmap);
    const mk = L.marker([s.city.lat, s.city.lng], { icon }).addTo(map);
    mk.bindTooltip(`${s.step}. ${s.city.name}`, { permanent:false, direction:'top', className:'pin-label' });
    mk.on('click', () => { goTo(s.globalIndex); setPlaying(false); });
    markers.push(mk);
    latlngs.push([s.city.lat, s.city.lng]);
  });

  if (localIndex > 0){
    routeLine = L.polyline(latlngs.slice(0, localIndex+1), {
      color: meta.color, weight:3.5, dashArray:'8 7', opacity:0.9
    }).addTo(map);
  }

  // pan/zoom to fit the active era's revealed route without being jarring
  if (latlngs.length){
    const bounds = L.latLngBounds(latlngs.slice(0, Math.max(localIndex+1,1)));
    map.flyToBounds(bounds.pad(0.5), { duration:0.6, maxZoom:7 });
  }
}

render();
</script>
</body>
</html>
